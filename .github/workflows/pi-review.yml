name: Pi Code Review

# Parallel multi-model PR review via fezcodev/pi-action/pr-review-fusion@v1:
# Reviewer A (claude-opus-5-5 | gpt-6.2-sol) + Reviewer B (gpt-6.2-sol | claude-opus-5-5),
# skeptically synthesized by claude-opus-5-5 (fallback gpt-6.2-sol), posted as
# github-actions[bot]. Repo guidance: .github/pi/review.md, read from the base branch.
# Needs the CLIPROXYAPI_API_KEY secret and CLIPROXYAPI_BASE_URL variable.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  pi-review:
    # Same-repo, human-authored PRs only: forks get no secrets, and bots are skipped.
    # `edited` runs only when the PR was retargeted to another base branch.
    if: >-
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pi-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: fezcodev/pi-action/pr-review-fusion@v1
        with:
          cliproxyapi-api-key: ${{ secrets.CLIPROXYAPI_API_KEY }}
          cliproxyapi-base-url: ${{ vars.CLIPROXYAPI_BASE_URL }}
