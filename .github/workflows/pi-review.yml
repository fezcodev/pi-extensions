name: Pi Code Review

# One approve-or-request-changes review per push from hank-warren/pi-action's
# reusable pr-review workflow, posted as github-actions[bot]. Older Pi reviews are
# collapsed. Repo guidance: .github/pi/review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  pi-review:
    uses: hank-warren/pi-action/.github/workflows/pr-review.yml@v1
    secrets:
      CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
